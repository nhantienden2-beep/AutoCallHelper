name: Build AutoCallHelper IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "AutoCallHelper_WindowsBuild/**"
      - ".github/workflows/ios-ipa.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      PROJECT: AutoCallHelper_WindowsBuild/AutoCallHelper.xcodeproj
      SCHEME: AutoCallHelper

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version and inspect project
        run: |
          set -euo pipefail
          xcodebuild -version
          test -d "$PROJECT" || {
            echo "::error::Xcode project not found: $PROJECT"
            find AutoCallHelper_WindowsBuild -maxdepth 4 -print
            exit 1
          }
          xcodebuild -list -project "$PROJECT"

      - name: Build for physical iOS devices (unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Verify built app
        id: verify
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/${SCHEME}.app"
          if [ ! -d "$APP" ]; then
            echo "::error::Built .app was not found at $APP"
            find "$RUNNER_TEMP/DerivedData/Build/Products" -maxdepth 4 -print || true
            exit 1
          fi
          if [ ! -f "$APP/Info.plist" ]; then
            echo "::error::Info.plist is missing from the app bundle"
            exit 1
          fi
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist"
          echo "app_path=$APP" >> "$GITHUB_OUTPUT"

      - name: Package and validate IPA
        run: |
          set -euo pipefail
          APP="${{ steps.verify.outputs.app_path }}"
          STAGE="$RUNNER_TEMP/ipa-stage"
          mkdir -p "$STAGE/Payload"
          ditto "$APP" "$STAGE/Payload/${SCHEME}.app"
          (
            cd "$STAGE"
            /usr/bin/zip -qry "$GITHUB_WORKSPACE/AutoCallHelper-unsigned.ipa" Payload
          )
          test -s "$GITHUB_WORKSPACE/AutoCallHelper-unsigned.ipa"
          unzip -t "$GITHUB_WORKSPACE/AutoCallHelper-unsigned.ipa"
          unzip -l "$GITHUB_WORKSPACE/AutoCallHelper-unsigned.ipa" | grep -E 'Payload/[^/]+\.app/Info\.plist$'

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: AutoCallHelper-unsigned-IPA
          path: AutoCallHelper-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
