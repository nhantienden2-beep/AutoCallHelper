name: Build AutoCallHelper IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "AutoCallHelper_WindowsBuild/**"
      - ".github/workflows/ios-ipa.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      PROJECT: AutoCallHelper_WindowsBuild/AutoCallHelper.xcodeproj
      SCHEME: AutoCallHelper

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version and inspect project
        run: |
          set -euo pipefail
          xcodebuild -version
          test -d "$PROJECT" || {
            echo "::error::Xcode project not found: $PROJECT"
            find AutoCallHelper_WindowsBuild -maxdepth 4 -print
            exit 1
          }
          xcodebuild -list -project "$PROJECT"

      - name: Build for physical iOS devices (unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

    
      - name: Verify built app
        id: verify
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/${SCHEME}.app"

          if [ ! -d "$APP" ]; then
            echo "::error::Built app not found: $APP"
            find "$RUNNER_TEMP/DerivedData/Build/Products" -maxdepth 5 -print || true
            exit 1
          fi

          echo "=== App bundle contents ==="
          ls -la "$APP"
          echo "=== Locate Info.plist ==="
          find "$APP" -name Info.plist -print

          PLIST="$APP/Info.plist"
          if [ ! -f "$PLIST" ]; then
            PLIST="$(find "$APP" -name Info.plist -print -quit)"
          fi

          if [ -z "${PLIST:-}" ] || [ ! -f "$PLIST" ]; then
            echo "::error::Info.plist not found inside app bundle"
            exit 1
          fi

          echo "=== Bundle identifier ==="
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST" || true

          echo "=== Executable ==="
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$PLIST" || true

          echo "app_path=$APP" >> "$GITHUB_OUTPUT"
