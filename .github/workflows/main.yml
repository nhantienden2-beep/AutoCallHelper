name: Build AutoCallHelper IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Find Xcode project
        id: project
        shell: bash
        run: |
          PROJECT=$(find . -name "*.xcodeproj" -type d -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Không tìm thấy file xcodeproj"
            find . -maxdepth 5 -type f
            exit 1
          fi

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Found project: $PROJECT"
          xcodebuild -list -project "$PROJECT"

      - name: Build app
        run: |
          xcodebuild \
            -project "${{ steps.project.outputs.project }}" \
            -scheme AutoCallHelper \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/build" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        shell: bash
        run: |
          APP=$(find "$RUNNER_TEMP/build/Build/Products/Release-iphoneos" \
            -maxdepth 1 -name "*.app" -type d -print -quit)

          if [ -z "$APP" ]; then
            echo "ERROR: Không tìm thấy ứng dụng đã build"
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -r AutoCallHelper-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AutoCallHelper-unsigned-ipa
          path: AutoCallHelper-unsigned.ipa
          if-no-files-found: error
